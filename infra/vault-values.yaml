global:
  tlsDisable: true
injector:
  enabled: false
server:
  image: {repository: hashicorp/vault, tag: "1.18.3"}
  logLevel: info
  resources:
    requests: {memory: 256Mi, cpu: 100m}
    limits: {memory: 512Mi}
  dataStorage: {enabled: true, size: 1Gi, storageClass: standard}
  ha:
    enabled: true
    replicas: 1
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = true
        listener "tcp" {
          address = "[::]:8200"
          cluster_address = "[::]:8201"
          tls_disable = 1
        }
        storage "raft" {
          path = "/vault/data"
        }
        service_registration "kubernetes" {}
