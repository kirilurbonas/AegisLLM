# Authorization: deny by default, then allow exactly what is needed.
#
# Two policies, and the order of reasoning matters:
#
#   1. `aegis-deny-all` is an ALLOW policy with no rules. In Istio that means
#      "allow nothing" — every request to every workload in the namespace is
#      refused unless another policy permits it. Starting from deny is the only
#      way to be sure about what is reachable; an allowlist bolted onto a
#      default-allow posture is a list of the things you remembered.
#
#   2. `aegis-gateway-callers` permits requests to the gateway that carry a
#      validated JWT principal. `requestPrincipals` only matches when the
#      RequestAuthentication above actually verified the token — a malformed or
#      absent token yields no principal and the request is denied here.
#
# Health probes are exempted by path: kubelet probes come from the node and carry
# no token, and a gateway that cannot be probed never becomes Ready. The exemption
# is narrow — two paths, no body, no model access.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: aegis-deny-all
  namespace: aegis
spec:
  {}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: aegis-gateway-callers
  namespace: aegis
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: aegis-gateway
  action: ALLOW
  rules:
    - from:
        - source:
            # Any authenticated caller from this cluster's issuer. Tightening this
            # to specific ServiceAccounts is a one-line change and is what a real
            # deployment would do per tenant.
            requestPrincipals: ["https://kubernetes.default.svc.cluster.local/*"]
      to:
        - operation:
            methods: ["POST", "GET"]
            paths: ["/v1/*"]
    - to:
        - operation:
            methods: ["GET"]
            paths: ["/healthz", "/readyz"]
---
# The gateway may call the quota store, and nothing else may.
#
# This rule exists because `aegis-deny-all` above did its job. Adding Redis, the
# gateway silently fell back to per-process counting: the connection was refused
# by mesh authorization, not by the network, so it looked like Redis was down.
# Deny-by-default means every new dependency has to be declared — which is the
# entire point, and also the part that costs you an afternoon the first time.
#
# Scoped to the gateway's SPIFFE identity rather than "anything in the namespace":
# a compromised sidecar-injected pod should not be able to read or poison other
# tenants' quota counters.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: aegis-redis-callers
  namespace: aegis
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: aegis-redis
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/aegis/sa/aegis-gateway
