name: Release verifier image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  # Required for sigstore keyless signing: the workflow's OIDC token *is* the
  # identity. No long-lived key exists to be stolen from CI, which is the whole
  # argument for keyless in a pipeline.
  id-token: write
  attestations: write

env:
  IMAGE: ghcr.io/${{ github.repository }}/aegis-verifier

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=sha,format=long

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Single manifest, no attestation manifests: a multi-arch index makes
          # signature verification resolve to a child digest that carries no
          # signature, which surfaces as a confusing "no signatures found".
          provenance: false
          sbom: false

      - name: Scan the image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          # The build fails on a CRITICAL/HIGH finding. A security tool that only
          # produces a report nobody reads is not a control.
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload the Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sarif
          path: trivy.sarif

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the image (keyless)
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}

      - name: Attach SLSA build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Verify what we just published
        # Signing without verifying is a leap of faith. This re-reads the
        # signature from the registry and checks it against this workflow's
        # identity, so a broken publish fails here rather than at a cluster.
        run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
