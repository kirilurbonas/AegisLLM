name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - run: uv sync --extra build

      - name: Lint
        run: uv run ruff check .

      - name: Test
        # Includes the gate test: a checkpoint whose __reduce__ calls os.system
        # must be flagged, and conversion must refuse to run on it.
        run: uv run pytest -q

  supply-chain-gate:
    name: Supply chain (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - run: uv sync --extra build

      - name: Run the pipeline end to end
        # --skip-registry stops after signing, so CI needs no registry and no
        # Docker. Signing uses the local-key mode; sigstore keyless has no
        # browser here, which is exactly why that mode exists.
        run: uv run aegis all --skip-registry

      - name: Publish the AIBOM and scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain-evidence
          path: |
            artifacts/reports/**/*.json
            artifacts/secured/**/aibom.cdx.json
          if-no-files-found: warn

  policies:
    name: Kyverno policy tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Kyverno CLI
        uses: kyverno/action-install-cli@v0.2.0

      - name: Test the admission policies
        # Asserts behaviour, not syntax: every example pod is checked against
        # every rule with an expected pass/fail. Weakening a rule turns this red
        # -- an admission gate that quietly stops enforcing is worse than none,
        # because everyone goes on assuming it works.
        run: kyverno version && cd policies/tests && kyverno test .
